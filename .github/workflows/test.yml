name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          $env:PYTHONPATH="src"
          python -m unittest discover -s tests -v
